[package]
name = "rust-gaming-wasm"
version = "0.1.0"
edition = "2024"

description = "A Rust → WASM canvas animation engine"
repository = "https://github.com/JoeSharp/ratracejoe.co.uk"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

go = { path = "../../external/rust-gaming/go" }
game-of-life = { path = "../../external/rust-gaming/game-of-life" }
adventure-engine = { path = "../../external/rust-gaming/adventure-engine" }

web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
] }
